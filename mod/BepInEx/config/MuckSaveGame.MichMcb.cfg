## Settings file was created by plugin MuckSaveGame v0.9.1
## Plugin GUID: MuckSaveGame.MichMcb

[Main]

## Whether or not to indent the XML save file elements and use newlines. This doesn't affect saving or loading in any way. Indenting the file takes up slightly more space, but makes it easier to read.
# Setting type: Boolean
# Default value: true
Indent = true

## The number of seconds you must wait until you can save your game again.
# Setting type: Int32
# Default value: 60
SaveCooldown = 60

## The names of the currently spawned mobs that are saved and restored.
# Setting type: String
# Default value: Big Chunk,Gronk,Guardian,Chief
SaveMobNames = Big Chunk,Gronk,Guardian,Chief

## The delay, in seconds, between clicking the Save button and the save actually executing when playing multiplayer. This is so the packets from clients have time to be sent over the network to the game host. There's no delay in singleplayer; saving always happens instantly.
# Setting type: Single
# Default value: 5
MultiplayerSaveDelay = 5

## Offsets the local player by this value on the Y axis when loading data. This can be useful to prevent you from falling through floors on loading a savegame. Doesn't work in multiplayer yet.
# Setting type: Single
# Default value: 0
VerticalOffset = 0

