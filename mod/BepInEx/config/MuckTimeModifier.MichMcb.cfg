## Settings file was created by plugin Muck Time Modifier v1.3.1
## Plugin GUID: MuckTimeModifier.MichMcb

[Main]

## Multiplies the base length of a single day/night cycle by this number. May not be 0. For example, 1 will leave it the same, 2 will double the length of a day cycle. Difficulty affects base the length of a day/night cycle.
# Setting type: Single
# Default value: 1
DayLengthMultiplier = 2

## During the nighttime, the speed at which time progresses is divided by this number. May not be 0. This has the effect of making time pass faster or slower at night. In vanilla, it is 0.3, meaning nighttime is 30% of the length of daytime (i.e. speed progresses 3.333... times faster)
# Setting type: Single
# Default value: 0.3
NightTimeSpeedDivisor = 0.15

## Divides the speed at which time passes by this number. May not be 0. For example, 1 will leave it the same, 1.5 makes a day/night cycle last 50% longer, 0.5 makes a day/night cycle last half as long. It works this way because say, a speed of 1 / 2 = 0.5, which is half speed, thus twice as long. Or 1 / 0.5 = 2; double speed, half as long.
# Setting type: Single
# Default value: 1.25
TimeSpeedMultiplier = 1.25

## On easy difficulty, every time the day number is evenly divisible by this number, then the day is a boss day. This causes a boss to spawn at night. By default it's 6, so this means days 6, 12, 18, etc. boss days.
# Setting type: Int32
# Default value: 6
EasyBossDay = 6

## On normal difficulty, every time the day number is evenly divisible by this number, then the day is a boss day.
# Setting type: Int32
# Default value: 4
NormalBossDay = 4

## On gamer difficulty, every time the day number is evenly divisible by this number, then the day is a boss day.
# Setting type: Int32
# Default value: 3
GamerBossDay = 3

